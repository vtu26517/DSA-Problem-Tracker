name: Java CI - Compile & Test DSA Problem Tracker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java Source Files
      run: |
        mkdir -p bin
        javac -d bin -sourcepath src \
          src/com/dsatracker/model/*.java \
          src/com/dsatracker/repository/*.java \
          src/com/dsatracker/sort/*.java \
          src/com/dsatracker/filter/*.java \
          src/com/dsatracker/service/*.java \
          src/com/dsatracker/ui/*.java \
          src/com/dsatracker/util/*.java \
          src/com/dsatracker/Main.java \
          tests/com/dsatracker/TestRunner.java

    - name: Run Automated Test Suite
      run: |
        java -cp bin com.dsatracker.TestRunner

    - name: Run CLI Demo Smoke Test
      run: |
        echo -e "2\n8\n10\n" | java -cp bin com.dsatracker.Main
